services:
  homestack:
    build: .
    image: homestack:latest
    restart: unless-stopped   # comes back after reboots and crashes
    # Run as your host user so the mounted folders below stay owned by you (check with `id -u` / `id -g`).
    user: "${HOMESTACK_UID:-1000}:${HOMESTACK_GID:-1000}"
    ports:
      - "${HOMESTACK_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-UTC}          # your time zone, e.g. America/Edmonton; "today", expiry dates, reminder and backup times use it
      Backup__Directory: /backups
      Backup__Keep: ${HOMESTACK_BACKUP_KEEP:-14}
    volumes:
      - ./data:/data          # the live SQLite database
      - ${HOMESTACK_BACKUPS:-./backups}:/backups   # nightly copies; point this at another disk or a synced folder
